<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayWise AI</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-grid">
        <div class="sidebar">
            <h1 class="title">WayWise AI</h1>

            <div class="form-container">
                <div class="input-with-button">
                    <input type="text" id="origin" placeholder="Enter Origin">
                    <button id="current-location-origin" class="location-btn" title="Use my current location">📍</button>
                </div>
                <div class="input-with-button">
                    <input type="text" id="destination" placeholder="Enter Destination">
                    <button id="current-location-dest" class="location-btn" title="Use my current location">📍</button>
                </div>
                <button id="start-nav-btn">Start Navigation</button>
            </div>

            <div id="in-trip-controls" class="hidden">
                <h3>Find on my way...</h3>
                <div class="stop-buttons">
                    <button class="stop-btn" data-query="petrol pump">Petrol</button>
                    <button class="stop-btn" data-query="restaurant">Restaurant</button>
                    <button class="stop-btn" data-query="dhaba">Dhaba</button>
                    <button class="stop-btn" data-query="atm">ATM</button>
                </div>
                <div class="custom-search-container">
                    <input type="text" id="custom-query-input" placeholder="e.g., coffee, pharmacy...">
                    <button id="custom-query-btn">Search</button>
                </div>
            </div>

            <div id="results-container">
                <div id="directions-panel" class="hidden"> 
                    <h2>Directions</h2>
                    <ul id="directions-ul"></ul>
                </div>
                <div id="stops-panel">
                    <h2>Suggested Stops</h2>
                    <ul id="stops-ul"></ul>
                </div>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
            <div id="current-turn-panel" class="hidden">
                </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
